name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz target
        default: "300"

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99"
  CARGO_FUZZ_VERSION: "0.13.2"

defaults:
  run:
    shell: bash
    working-directory: rinse

jobs:
  macos:
    name: macOS (mise run check)
    if: github.event_name != 'schedule'
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rinse
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peleda-app/dojo
          path: dojo
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          working_directory: rinse
      - run: rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN" && rustup target add wasm32-wasip2 --toolchain "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            rinse -> target
            dojo -> target
      - run: mise run check

  linux:
    name: Linux (check image)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      LINUX_CACHE_DIR: ${{ github.workspace }}/.linux-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rinse
          persist-credentials: false
      - id: linux-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .linux-cache
          key: linux-${{ hashFiles('rinse/Cargo.lock', 'rinse/tests/linux/Dockerfile') }}
          restore-keys: linux-
      - run: bash tests/linux/run.sh bash scripts/check-linux.sh
      - name: Drop incremental build state before saving the cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.linux-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: sudo find .linux-cache/target -maxdepth 3 -type d -name incremental -prune -exec rm -rf {} +
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.linux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .linux-cache
          key: linux-${{ hashFiles('rinse/Cargo.lock', 'rinse/tests/linux/Dockerfile') }}

  windows:
    name: Windows compile check
    if: github.event_name != 'schedule'
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rinse
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          working_directory: rinse
      - run: rustup target add aarch64-pc-windows-msvc --toolchain "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rinse -> target
          key: windows
      - run: mise run check-windows

  dependencies:
    name: cargo deny
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rinse
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          working_directory: rinse
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "rinse -> target"
          key: deny
      - run: cargo install --locked cargo-deny
      - run: cargo deny check advisories bans licenses sources

  fuzz:
    name: Fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rinse
          persist-credentials: false
      - name: Install the pinned nightly
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          nightly="$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' fuzz/rust-toolchain.toml)"
          rustup toolchain install "$nightly" --profile minimal
          echo "FUZZ_NIGHTLY=$nightly" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rinse/fuzz -> target
      - name: Install cargo-fuzz (kept in ~/.cargo/bin by rust-cache)
        run: |
          if [ "$(cargo-fuzz --version 2>/dev/null)" != "cargo-fuzz $CARGO_FUZZ_VERSION" ]; then
            cargo "+$FUZZ_NIGHTLY" install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rinse/fuzz/work
          key: fuzz-work-${{ github.run_id }}
          restore-keys: fuzz-work-
      - name: Fuzz every target
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: bash fuzz/run.sh all "$SECONDS_PER_TARGET"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: rinse/fuzz/artifacts
          if-no-files-found: ignore
