[package]
name = "rinse-mail-wasm"
description = "The content pipeline over rinse-wasm: the embedded content worker component with memory, time and output limits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = ["embedded"]
embedded = []
pulley = ["rinse-wasm/pulley"]

[dependencies]
rinse-mail.workspace = true
rinse-wasm.workspace = true
async-trait.workspace = true
postcard.workspace = true
tokio = { workspace = true, features = ["rt"] }

[build-dependencies]
rinse-build.workspace = true

[dev-dependencies]
rinse-mail = { workspace = true, features = ["testing"] }
bytes.workspace = true
tokio.workspace = true

[package.metadata.dojo]
kind = "implementation"
implements = "rinse-mail"

[lints]
workspace = true
