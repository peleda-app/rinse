[package]
name = "rinse-sandbox"
description = "Contract for sandboxed worker processes: what a worker may do, how it is started and how it locks itself down"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
testing = ["dep:tokio"]

[dependencies]
async-trait.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["net"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["pipe", "process"] }

[dev-dependencies]
tokio.workspace = true

[package.metadata.dojo]
kind = "contract"

[lints]
workspace = true
