[package]
name = "rinse-host"
description = "The child side of a sandboxed WebAssembly worker: lock down, compile the component, warm up, announce, serve exactly one request"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
probe = ["rinse-sandbox/testing"]

[dependencies]
rinse-process.workspace = true
rinse-sandbox.workspace = true
rinse-wasm.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
rinse-sandbox-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rinse-sandbox-linux.workspace = true

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
rinse-sandbox-none.workspace = true

[dev-dependencies]
rinse-wasm-fixtures.workspace = true
tokio.workspace = true

[[test]]
name = "serve"
harness = false

[[test]]
name = "probe"
harness = false
required-features = ["probe"]

[package.metadata.dojo]
kind = "library"

[lints]
workspace = true
