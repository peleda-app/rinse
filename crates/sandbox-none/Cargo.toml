[package]
name = "rinse-sandbox-none"
description = "No sandbox: starts workers without restrictions, for development and tests only (not a wall)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rinse-sandbox.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time"] }

[dev-dependencies]
rinse-sandbox = { workspace = true, features = ["testing"] }
tokio.workspace = true

[[test]]
name = "conformance"
harness = false

[package.metadata.dojo]
kind = "implementation"
implements = "rinse-sandbox"

[lints]
workspace = true
