[package]
name = "rinse-process"
description = "Runs every request in a fresh locked-down worker process started through a rinse-sandbox launcher: framed request and response, size cap, wall-clock kill, warm pool used once"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rinse-sandbox.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
rinse-sandbox-macos.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rinse-sandbox-linux.workspace = true

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dev-dependencies]
rinse-sandbox-none.workspace = true

[[test]]
name = "runner"
harness = false

[package.metadata.dojo]
kind = "library"

[lints]
workspace = true
