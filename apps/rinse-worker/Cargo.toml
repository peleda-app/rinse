[package]
name = "rinse-worker"
description = "The mail worker executable: rinse-host with the embedded mail worker, serving one request under the platform sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
probe = ["rinse-host/probe"]

[dependencies]
rinse-mail.workspace = true
rinse-mail-process.workspace = true
rinse-mail-wasm.workspace = true
rinse-host.workspace = true

[dev-dependencies]
rinse-mail = { workspace = true, features = ["testing"] }
rinse-sandbox.workspace = true
bytes.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
rinse-sandbox-macos.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rinse-sandbox-linux.workspace = true

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dev-dependencies]
rinse-sandbox-none.workspace = true

[[bin]]
name = "rinse-worker-host"
path = "src/main.rs"

[[test]]
name = "serve"
harness = false

[[test]]
name = "probe"
harness = false
required-features = ["probe"]

[package.metadata.dojo]
kind = "app"

[lints]
workspace = true
